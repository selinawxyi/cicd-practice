name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx:latest .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx:latest

      - name: Deploy to server
        run: |
          echo "SSH into server..."
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx:latest"
          echo "docker stop my-nginx || true"
          echo "docker run -d -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx:latest"
          echo "Deployment complete!"